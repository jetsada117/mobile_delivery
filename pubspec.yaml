name: mobile_delivery
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  google_fonts: ^6.3.1
  flex_color_scheme: ^8.3.0
  provider: ^6.1.5+1
  image_picker: ^1.2.0
  path_provider: ^2.1.5
  geolocator: ^14.0.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  firebase_core: ^4.1.1
  cloud_firestore: ^6.0.2
  supabase_flutter: ^2.10.1
  http: ^1.5.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# ✅ ต้องอยู่ระดับ root (ไม่ indent เข้ามา)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/system/logo.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/images/system/
